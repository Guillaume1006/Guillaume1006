name: Build IOSLauncher APK

on:
  push:
    paths:
      - "IOSLauncher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IOSLauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (signé avec la clé debug, installable)
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: IOSLauncher-apk
          path: IOSLauncher/app/build/outputs/apk/debug/app-debug.apk
