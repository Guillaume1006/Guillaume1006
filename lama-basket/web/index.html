<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d0b36">
<title>Lama Basket</title>
<style>
:root{--bg:#1d0b36;--ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d0b36;--ink:#ffffff}}
:root[data-theme="dark"]{--bg:#1d0b36;--ink:#ffffff}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const FONT="'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Roboto,system-ui,sans-serif";
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* =========================================================
   MONDE 3D (physique) + projection "stand de fête foraine"
   ========================================================= */
const G=11, BR=0.125, RR=0.27, RT=0.02, HZ=3.2, RH=3.0;
const BOARD_HW=0.4, BOARD_BOT=-0.09, BOARD_TOP=0.55, BZ=HZ+RR+0.1;
const bzOf=hp=>hp.z+RR+0.1; // plan de la planche (le panier peut se balancer en profondeur)
const ZR=0.85, LAMA_H=0.62, LAMA_W=0.24, LAMA_RANGE=1.15, SWING_W=1.05; // lama funambule : profondeur du fil, taille ; pulsation du balancier
let ropeY=2.5; // hauteur du fil (calée sur la trajectoire d'un tir centré)
function layoutRope(){const t=ZR/HZ*FT;ropeY=START_Y+VY0*t-0.5*G*t*t-LAMA_H*0.55;}
const START_X=0, WALL_Z=3.9;
let START_Y=1.8; // hauteur du ballon au départ (ajustée au décor HD)
let FLOOR_Y=0.8; // sol de la scène (recalculé selon l'écran) ; le ballon repose sur un podium
const FT=1.1; // durée du vol jusqu'à la hauteur du cercle (arc haut, ballon qui retombe dans le panier)
let VY0=(RH-START_Y+0.5*G*FT*FT)/FT;
const POWER_K=0.85; // mètres de profondeur par unité d'écart de swipe
const ZD=4.5, YREF=3.0;
let S0=342;
let KZ=60;

let W=540,H=960,SC=1,DPR=1,CX=270,rimY=288,G0=480,horizonY=529,ballSY=840;
function sAt(z){return S0/(1+z/ZD);}
function proj(x,y,z){const s=sAt(z);return {x:CX+x*s,y:G0-z*KZ-(y-YREF)*s,s:s};}

let bgKey='';
function resize(){
  const cw=Math.max(1,window.innerWidth), ch=Math.max(1,window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1,2);
  SC=Math.min(cw/540,ch/960);
  W=cw/SC; H=ch/SC; CX=W/2;
  cvs.width=Math.round(cw*DPR); cvs.height=Math.round(ch*DPR);
  if(HDM.ready){hdLayout();bgKey='';return;}
  S0=342;START_Y=1.8;VY0=(RH-START_Y+0.5*G*FT*FT)/FT;
  const wantBall=H*0.86,lift=(YREF-START_Y)*S0;
  rimY=Math.round(clamp(H*0.36,250,470));
  KZ=clamp((wantBall-rimY-lift)/HZ,40,105);
  rimY=Math.round(wantBall-lift-HZ*KZ);
  G0=rimY+HZ*KZ;
  ballSY=proj(START_X,START_Y,0).y;
  horizonY=Math.round(clamp(H*0.68,rimY+190,ballSY-120));
  FLOOR_Y=YREF-(horizonY-G0+WALL_Z*KZ)/sAt(WALL_Z);
  layoutStage();layoutRope();
  bgKey='';
}
let OX=0,OY=0,SHK=0; // secousse de l'écran (le monde bouge, pas l'interface)
function L(){ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*SC*DPR,OY*SC*DPR);}
function Lpx(){ctx.setTransform(1,0,0,1,OX*SC*DPR,OY*SC*DPR);}
function shake(a){SHK=Math.max(SHK,a);}

/* =========================================================
   SAUVEGARDE
   ========================================================= */
const NLEV=80, LEVEL_TIME=60;
// Réglages calibrés avec botRun() (voir README)
const SPEED_A=0.28,SPEED_B=0.34,PAUSE_RATE=0.1,FLIP_RATE=0.16,FRENZY_T=10,CLOCK_BONUS=3;
const SAVE_KEY='lamaBasket.v1';
const save=(function(){let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}
  return Object.assign({done:0,stars:{},best:{},rec:{},ball:0,sound:true,music:true},s||{});})();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const unlockedLevel=()=>Math.min(NLEV,save.done+1);
const ballUnlocked=k=>k===0||save.done>=k*5;

/* =========================================================
   NIVEAUX
   ========================================================= */
// Nouveautés : une mécanique de plus tous les quelques niveaux (annoncée dans l'écran d'intro)
const FEATURES=[
  [3,'clock','Ballon horloge : marque-le pour gagner '+CLOCK_BONUS+' secondes'],
  [5,'ease','Le panier accélère au milieu'],
  [9,'pauses','Le panier s’arrête par surprise'],
  [12,'reverse','Le panier fait demi-tour sans prévenir'],
  [15,'vary','Le panier change de vitesse'],
  [18,'swing','Le panier se balance d’avant en arrière : dose ta force'],
  [21,'wind','Le vent souffle : vise à côté pour compenser'],
  [25,'lama','Un lama funambule passe sur son fil : ne le touche pas !'],
  [32,'bob','Le panier monte et descend'],
  [42,'gust','Rafales : le vent tourne plus souvent']
];
function levelCfg(L){
  const t=(L-1)/79,has=k=>FEATURES.some(f=>f[1]===k&&L>=f[0]);
  const feat=FEATURES.find(f=>f[0]===L);
  // épreuves : Série (niveaux en 4), Précision (niveaux en 7), Score pour les autres
  const kind=L%10===4?'streak':L%10===7?'precision':'score';
  const goals=kind==='streak'?streakGoals(L):kind==='precision'?precisionGoals(L):(T0=>[T0,Math.round(T0*1.5),T0*2])(targetFor(L));
  return {L,kind,goals,decor:Math.min(7,Math.floor((L-1)/10)),time:kind==='precision'?0:LEVEL_TIME,
    target:goals[0],balls:kind==='precision'?PREC_BALLS:0,
    speed:SPEED_A+SPEED_B*Math.pow(t,0.8),
    range:Math.min(0.68,0.42+L*0.005),
    ease:has('ease'),pauses:has('pauses'),reverse:has('reverse'),vary:has('vary'),
    bob:has('bob')?0.06+0.1*clamp((L-32)/48,0,1):0,
    swing:has('swing')?0.15+0.15*clamp((L-18)/62,0,1):0,
    lama:has('lama')?0.3+0.2*clamp((L-25)/55,0,1):0,
    wind:has('wind')?0.22+0.2*clamp((L-21)/59,0,1):0,windEvery:has('gust')?[4,6.5]:[6,9],
    pauseRate:PAUSE_RATE,flipRate:FLIP_RATE,
    assist:Math.max(0,0.22*(1-(L-1)/10)),gold:kind==='score'?1/10:0,clock:has('clock')&&kind!=='precision'?1/10:0,
    feature:feat?feat[2]:null};
}
function starsFor(v,g){return v>=g[2]?3:v>=g[1]?2:v>=g[0]?1:0;}
const PREC_BALLS=15;
function streakGoals(L){const n=L<10?6:L<40?5:4;return [n,n+2,n+4];}
function precisionGoals(L){const t=(L-1)/79,n=Math.round(9-4.5*t);return [n,Math.min(PREC_BALLS,n+2),Math.min(PREC_BALLS,n+4)];}
const KIND_NAME={score:'Score',streak:'Série',precision:'Précision'};
function goalText(cfg,v,short){
  if(cfg.kind==='streak')return short?'Série de '+v:v+' paniers d’affilée';
  if(cfg.kind==='precision')return short?v+' sur '+cfg.balls:v+' paniers sur '+cfg.balls+' ballons';
  return short?v+' pts':v+' points';
}
function multFor(s){return s>=10?4:s>=6?3:s>=3?2:1;}
// points d'un panier : 2, parfait 3, doré +5 ; × série ; × 2 pendant la frénésie des 10 dernières secondes
function pointsFor(perfect,gold,streak,frenzy){return (2+(perfect?1:0)+(gold?5:0))*multFor(streak)*(frenzy?2:1);}
function targetFor(L){const t=(L-1)/79;return Math.round(55+10*Math.min(1,t/0.3)+5*Math.max(0,(t-0.5)/0.5));}

/* =========================================================
   BALLONS
   ========================================================= */
const BALLS=[
 {n:'Classique',p:'basket',c:['#f47a20','#2a1206']},
 {n:'Rétro',p:'basket',c:['#9c5a2a','#24120a']},
 {n:'Glacier',p:'basket',c:['#62c8ff','#0b3554']},
 {n:'Bonbon',p:'basket',c:['#ff86c4','#6a1040']},
 {n:'Citron vert',p:'basket',c:['#b4ec45','#2c4a05']},
 {n:'Pastèque',p:'melon'},
 {n:'Cirque',p:'wedge',c:['#e8322f','#fff4e0']},
 {n:'Arc-en-ciel',p:'rainbow'},
 {n:'Barbe à papa',p:'swirl',c:['#ffb6dc','#9fd8ff']},
 {n:'Lama',p:'lama'},
 {n:'Plage',p:'wedge',c:['#ff4b4b','#ffffff','#2f8bff','#ffffff','#ffd23f','#ffffff']},
 {n:'Lune',p:'moon'},
 {n:'Lave',p:'lava'},
 {n:'Galaxie',p:'galaxy'},
 {n:'Néon',p:'neon'},
 {n:'Diamant',p:'diamond'},
 {n:"Feu d'artifice",p:'firework'}
];
const GOLD={n:'Doré',p:'gold'};
const GAL_STARS=(()=>{const R=mulberry(7),a=[];for(let i=0;i<22;i++)a.push([R()*2-1,R()*2-1,0.02+R()*0.05]);return a;})();
const LAVA=[[[-1,-0.3],[-0.5,-0.1],[-0.2,-0.42],[0.3,-0.2],[1,-0.5]],[[-0.9,0.5],[-0.3,0.3],[0.1,0.62],[0.6,0.35],[1,0.6]],[[-0.2,-0.42],[-0.08,0.32]],[[0.3,-0.2],[0.45,-1]],[[0.1,0.62],[0.05,1]]];

function seams(c,r,col){
  c.strokeStyle=col;c.lineWidth=Math.max(1.2,r*0.075);c.lineCap='round';
  c.beginPath();c.moveTo(-r,0);c.lineTo(r,0);c.stroke();
  c.beginPath();c.moveTo(0,-r);c.lineTo(0,r);c.stroke();
  c.beginPath();c.arc(-r*1.55,0,r*1.15,-0.95,0.95);c.stroke();
  c.beginPath();c.arc(r*1.55,0,r*1.15,Math.PI-0.95,Math.PI+0.95);c.stroke();
}
function lamaFace(c,r){
  c.fillStyle='#fbf1e1';c.fillRect(-r,-r,2*r,2*r);
  c.fillStyle='#e9d6bb';
  c.beginPath();c.ellipse(-0.5*r,-0.82*r,0.17*r,0.4*r,-0.4,0,TAU);c.fill();
  c.beginPath();c.ellipse(0.5*r,-0.82*r,0.17*r,0.4*r,0.4,0,TAU);c.fill();
  c.fillStyle='#ffb3c7';
  c.beginPath();c.ellipse(-0.5*r,-0.8*r,0.08*r,0.25*r,-0.4,0,TAU);c.fill();
  c.beginPath();c.ellipse(0.5*r,-0.8*r,0.08*r,0.25*r,0.4,0,TAU);c.fill();
  c.fillStyle='#fffaf2';
  [[-0.25,-0.6],[0,-0.7],[0.25,-0.6]].forEach(([x,y])=>{c.beginPath();c.arc(x*r,y*r,0.2*r,0,TAU);c.fill();});
  c.fillStyle='#2b1a12';
  c.beginPath();c.arc(-0.32*r,-0.1*r,0.11*r,0,TAU);c.fill();
  c.beginPath();c.arc(0.32*r,-0.1*r,0.11*r,0,TAU);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.arc(-0.29*r,-0.14*r,0.04*r,0,TAU);c.fill();
  c.beginPath();c.arc(0.35*r,-0.14*r,0.04*r,0,TAU);c.fill();
  c.fillStyle='#f0d6b6';c.beginPath();c.ellipse(0,0.36*r,0.42*r,0.3*r,0,0,TAU);c.fill();
  c.fillStyle='#5b3b2b';
  c.beginPath();c.arc(-0.12*r,0.28*r,0.05*r,0,TAU);c.fill();
  c.beginPath();c.arc(0.12*r,0.28*r,0.05*r,0,TAU);c.fill();
  c.strokeStyle='#5b3b2b';c.lineWidth=Math.max(1,r*0.06);c.beginPath();c.arc(0,0.38*r,0.16*r,0.2,Math.PI-0.2);c.stroke();
  c.fillStyle='rgba(255,120,150,0.35)';
  c.beginPath();c.arc(-0.55*r,0.15*r,0.12*r,0,TAU);c.fill();
  c.beginPath();c.arc(0.55*r,0.15*r,0.12*r,0,TAU);c.fill();
}
function paintPattern(c,r,B){
  switch(B.p){
  case 'basket':c.fillStyle=B.c[0];c.fillRect(-r,-r,2*r,2*r);seams(c,r,B.c[1]);break;
  case 'gold':{const g=c.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#fff3a6');g.addColorStop(0.45,'#ffc61a');g.addColorStop(1,'#c47a00');
    c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);seams(c,r,'#8a5200');break;}
  case 'melon':{c.fillStyle='#4fb83a';c.fillRect(-r,-r,2*r,2*r);c.strokeStyle='#1f5e18';c.lineWidth=r*0.16;c.lineJoin='round';
    for(let i=-2;i<=2;i++){c.beginPath();for(let k=0;k<=8;k++){const y=-r+k*r/4;const x=i*r*0.42+((k%2)?r*0.07:-r*0.07);k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
    break;}
  case 'wedge':{const n=B.c.length===2?8:B.c.length;for(let i=0;i<n;i++){c.fillStyle=B.c[i%B.c.length];c.beginPath();c.moveTo(0,0);c.arc(0,0,r*1.05,i*TAU/n,(i+1)*TAU/n);c.closePath();c.fill();}
    c.fillStyle='#fff';c.beginPath();c.arc(0,0,r*0.16,0,TAU);c.fill();break;}
  case 'rainbow':{const cols=['#ff3b3b','#ff9a1f','#ffe23b','#3fd15a','#2f8bff','#8b4bff'];for(let i=0;i<6;i++){c.fillStyle=cols[i];c.fillRect(-r,-r+i*r/3,2*r,r/3+1);}
    seams(c,r,'rgba(40,10,60,0.5)');break;}
  case 'swirl':{c.fillStyle=B.c[0];c.fillRect(-r,-r,2*r,2*r);c.strokeStyle=B.c[1];c.lineWidth=r*0.3;c.lineCap='round';
    for(let k=0;k<3;k++){c.beginPath();for(let i=0;i<=20;i++){const u=i/20,a=k*TAU/3+u*3.6,q=u*r*1.1;const x=Math.cos(a)*q,y=Math.sin(a)*q;i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
    break;}
  case 'lama':lamaFace(c,r);break;
  case 'moon':{c.fillStyle='#c7cad6';c.fillRect(-r,-r,2*r,2*r);
    [[-0.35,-0.3,0.28],[0.4,0.1,0.22],[-0.1,0.45,0.18],[0.2,-0.5,0.12],[-0.6,0.25,0.1]].forEach(([x,y,s])=>{
      c.fillStyle='#9a9eae';c.beginPath();c.arc(x*r,y*r,s*r,0,TAU);c.fill();
      c.fillStyle='#b3b7c6';c.beginPath();c.arc(x*r+s*r*0.15,y*r+s*r*0.15,s*r*0.75,0,TAU);c.fill();});break;}
  case 'lava':{c.fillStyle='#3a110a';c.fillRect(-r,-r,2*r,2*r);c.lineCap='round';c.lineJoin='round';
    for(const pass of [[r*0.2,'#ff5a00'],[r*0.08,'#ffd24a']]){c.lineWidth=pass[0];c.strokeStyle=pass[1];
      for(const pl of LAVA){c.beginPath();pl.forEach(([x,y],i)=>i?c.lineTo(x*r,y*r):c.moveTo(x*r,y*r));c.stroke();}}
    break;}
  case 'galaxy':{const g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'#4a2290');g.addColorStop(1,'#0a0620');c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);
    const n=c.createRadialGradient(r*0.3,-r*0.2,0,r*0.3,-r*0.2,r*0.7);n.addColorStop(0,'rgba(255,90,200,0.7)');n.addColorStop(1,'rgba(255,90,200,0)');c.fillStyle=n;c.fillRect(-r,-r,2*r,2*r);
    c.fillStyle='#fff';for(const s of GAL_STARS){c.beginPath();c.arc(s[0]*r,s[1]*r,s[2]*r,0,TAU);c.fill();}break;}
  case 'neon':{c.fillStyle='#0f0a20';c.fillRect(-r,-r,2*r,2*r);
    seams(c,r,'rgba(0,255,255,0.28)');c.lineWidth=r*0.24;c.stroke();
    seams(c,r,'#8ffcff');
    c.strokeStyle='#ff4fd8';c.lineWidth=r*0.08;c.beginPath();c.arc(0,0,r*0.62,0,TAU);c.stroke();break;}
  case 'diamond':{c.fillStyle='#8ef0ff';c.fillRect(-r,-r,2*r,2*r);const n=8;
    for(let i=0;i<n;i++){const a0=i*TAU/n,a1=(i+1)*TAU/n;c.fillStyle=i%2?'rgba(255,255,255,0.45)':'rgba(0,90,140,0.28)';
      c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a0)*r*1.1,Math.sin(a0)*r*1.1);c.lineTo(Math.cos(a1)*r*1.1,Math.sin(a1)*r*1.1);c.closePath();c.fill();}
    c.strokeStyle='rgba(255,255,255,0.8)';c.lineWidth=r*0.05;c.beginPath();for(let i=0;i<=n;i++){const a=i*TAU/n;const x=Math.cos(a)*r*0.5,y=Math.sin(a)*r*0.5;i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();break;}
  case 'firework':{c.fillStyle='#121a4d';c.fillRect(-r,-r,2*r,2*r);c.lineCap='round';
    [[-0.4,-0.3,'#ff4fa0'],[0.38,0.12,'#ffd23f'],[-0.1,0.52,'#4fe0ff']].forEach(([x,y,col])=>{c.strokeStyle=col;c.lineWidth=r*0.07;
      for(let i=0;i<8;i++){const a=i*TAU/8;c.beginPath();c.moveTo(x*r+Math.cos(a)*r*0.1,y*r+Math.sin(a)*r*0.1);c.lineTo(x*r+Math.cos(a)*r*0.34,y*r+Math.sin(a)*r*0.34);c.stroke();}
      c.fillStyle=col;c.beginPath();c.arc(x*r,y*r,r*0.06,0,TAU);c.fill();});break;}
  }
}
function drawBall(c,x,y,r,skin,rot,gold,alpha){
  if(HDM.ready&&HDM.skins[0])return drawBallHD(c,x,y,r,skin,rot,gold,alpha);
  const B=gold?GOLD:(BALLS[skin]||BALLS[0]);
  c.save();
  if(alpha!=null&&alpha<1)c.globalAlpha=Math.max(0,alpha);
  c.translate(x,y);
  if(gold){const gl=c.createRadialGradient(0,0,r*0.8,0,0,r*1.9);gl.addColorStop(0,'rgba(255,220,80,0.55)');gl.addColorStop(1,'rgba(255,220,80,0)');c.fillStyle=gl;c.beginPath();c.arc(0,0,r*1.9,0,TAU);c.fill();}
  if(B.p==='neon'){const gl=c.createRadialGradient(0,0,r*0.9,0,0,r*1.5);gl.addColorStop(0,'rgba(0,255,255,0.35)');gl.addColorStop(1,'rgba(0,255,255,0)');c.fillStyle=gl;c.beginPath();c.arc(0,0,r*1.5,0,TAU);c.fill();}
  c.save();c.beginPath();c.arc(0,0,r,0,TAU);c.clip();c.rotate(rot||0);paintPattern(c,r,B);c.restore();
  const g=c.createRadialGradient(-r*0.35,-r*0.4,r*0.05,-r*0.15,-r*0.2,r*1.15);
  g.addColorStop(0,'rgba(255,255,255,0.55)');g.addColorStop(0.3,'rgba(255,255,255,0.08)');g.addColorStop(0.65,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.4)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();
  c.lineWidth=Math.max(1.4,r*0.06);c.strokeStyle='rgba(30,12,4,0.85)';c.stroke();
  c.restore();
}

/* =========================================================
   DÉCORS — la scène du chapiteau (aperçu validé), déclinée en 8 ambiances
   ========================================================= */
const DECORS=[

function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starPath(c,x,y,R,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();}
function mkCanvas(){const c=document.createElement('canvas');c.width=cvs.width;c.height=cvs.height;const x=c.getContext('2d');x.setTransform(SC*DPR,0,0,SC*DPR,0,0);return [c,x];}
function addBulb(arr,x,y,col,g,i,r){arr.push({x,y,c:col,g:g||0,i:i==null?arr.length:i,r:r||3.4});}

const bulbCache={};
function bulbSprite(col,on){
  const k=col+(on?1:0);if(bulbCache[k])return bulbCache[k];
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');
  if(on){const g=x.createRadialGradient(24,24,2,24,24,24);g.addColorStop(0,col);g.addColorStop(0.25,col+'cc');g.addColorStop(1,col+'00');x.fillStyle=g;x.beginPath();x.arc(24,24,24,0,TAU);x.fill();
    x.fillStyle='#fffbe8';x.beginPath();x.arc(24,24,7.5,0,TAU);x.fill();x.fillStyle=col;x.globalAlpha=0.6;x.beginPath();x.arc(24,24,7.5,0,TAU);x.fill();x.globalAlpha=1;x.fillStyle='#fff';x.beginPath();x.arc(22,22,3,0,TAU);x.fill();}
  else{x.fillStyle='#3a2a30';x.beginPath();x.arc(24,24,8.5,0,TAU);x.fill();x.fillStyle=col;x.globalAlpha=0.45;x.beginPath();x.arc(24,24,7,0,TAU);x.fill();x.globalAlpha=1;x.fillStyle='rgba(255,255,255,0.5)';x.beginPath();x.arc(22,21,2,0,TAU);x.fill();}
  bulbCache[k]=c;return c;
}
function bulbOn(g,i,t){
  if(g===0)return ((i+Math.floor(t*5))%3)!==0;
  if(g===1)return Math.sin(t*2.6+i*0.9)>-0.25;
  return ((i+Math.floor(t*2.5))%2)===0;
}
function drawBulbAt(c,x,y,col,on,r){const s=bulbSprite(col,on);const q=(r||3.4)*3.2;c.drawImage(s,x-q,y-q,q*2,q*2);}

/* ---------- mise en place de la scène ---------- */
function layoutStage(){
  const bt=proj(0,RH+BOARD_TOP,BZ).y;
  railY=Math.round(bt-40);
  apexY=Math.round(Math.max(26,railY-clamp(railY*0.55,90,160)));
  stageTop=railY+16;
  openW=Math.round(W*0.27);
  tieY=Math.round(horizonY-(horizonY-stageTop)*0.36);
  podY=ballSY+BR*S0;
}
function tvRects(){const w=138,h=128,y=railY+64;return [{x:12,y,w,h},{x:W-12-w,y,w,h}];}
function tvScreen(r){return {x:r.x+12,y:r.y+12,w:r.w-24,h:r.h-24};}
function openingPath(c){
  const mid=stageTop+(tieY-stageTop)*0.5;
  c.beginPath();c.moveTo(CX-openW*0.22,stageTop+24);
  c.quadraticCurveTo(CX-openW*0.92,mid,CX-openW,tieY);c.lineTo(CX-openW-8,horizonY+2);c.lineTo(CX+openW+8,horizonY+2);
  c.lineTo(CX+openW,tieY);c.quadraticCurveTo(CX+openW*0.92,mid,CX+openW*0.22,stageTop+24);c.closePath();
}
function wheelGeom(d){
  if(!d.wheel)return null;const R=clamp((horizonY-stageTop)*0.3,70,118);
  return {cx:CX+d.side*openW*0.36,cy:horizonY-34-R,R};
}
function buildBG(di){
  const d=DECORS[di];BULBS=[];SCENE_BULBS=[];
  const [bc,b]=mkCanvas();drawBack(b,d,di);
  const [sc,s]=mkCanvas();drawScene(s,d);
  const [mc,m]=mkCanvas();drawMid(m,d,di);
  bgBack=bc;bgScene=sc;bgMid=mc;curDecor=di;bgKey=di+':'+cvs.width+'x'+cvs.height;
  fxReset(d);
}
function ensureBG(di){if(bgKey!==di+':'+cvs.width+'x'+cvs.height)buildBG(di);}

  if(d.inner){drawInnerCurtain(c,d);return;}
  const ox=CX-d.side*openW*0.5,oy=stageTop+(tieY-stageTop)*0.42;
  if(d.sun){const gl=c.createRadialGradient(ox,oy,10,ox,oy,140);gl.addColorStop(0,'rgba(255,250,210,0.85)');gl.addColorStop(1,'rgba(255,250,210,0)');c.fillStyle=gl;c.fillRect(ox-150,oy-150,300,300);
    c.fillStyle=d.sun;c.beginPath();c.arc(ox,oy,38,0,TAU);c.fill();}
  if(d.moon){const r=d.spooky?50:36;const gl=c.createRadialGradient(ox,oy,r*0.6,ox,oy,r*3);gl.addColorStop(0,d.spooky?'rgba(255,200,120,0.45)':'rgba(255,250,220,0.35)');gl.addColorStop(1,'rgba(255,250,220,0)');
    c.fillStyle=gl;c.beginPath();c.arc(ox,oy,r*3,0,TAU);c.fill();c.fillStyle=d.spooky?'#ffe1a0':'#fff5d6';c.beginPath();c.arc(ox,oy,r,0,TAU);c.fill();
    c.fillStyle='rgba(180,160,120,0.25)';[[-0.3,-0.2,0.22],[0.25,0.15,0.18],[-0.05,0.4,0.12]].forEach(([x,y,s])=>{c.beginPath();c.arc(ox+x*r,oy+y*r,s*r,0,TAU);c.fill();});}
  if(d.sunset){const sx=CX,sy=horizonY-60;const gl=c.createRadialGradient(sx,sy,20,sx,sy,240);gl.addColorStop(0,'rgba(255,230,140,0.8)');gl.addColorStop(1,'rgba(255,140,90,0)');c.fillStyle=gl;c.fillRect(0,sy-240,W,480);
    const sg=c.createLinearGradient(0,sy-90,0,sy+30);sg.addColorStop(0,'#fff0a0');sg.addColorStop(1,'#ff7a3a');c.fillStyle=sg;c.beginPath();c.arc(sx,sy,90,0,TAU);c.fill();
    c.fillStyle='#e8657a';for(let i=0;i<5;i++)c.fillRect(sx-100,sy+i*12-8,200,3+i*1.4);}
  if(d.beach){const sg=c.createLinearGradient(0,horizonY-70,0,horizonY);sg.addColorStop(0,'#1f7fd6');sg.addColorStop(1,'#56c3ea');c.fillStyle=sg;c.fillRect(0,horizonY-70,W,74);
    c.strokeStyle='rgba(255,255,255,0.55)';c.lineWidth=2;for(let i=0;i<14;i++){const y=horizonY-62+R()*56,x=R()*W;c.beginPath();c.moveTo(x,y);c.lineTo(x+16+R()*24,y);c.stroke();}}
  else{c.fillStyle=d.far||'#556';c.beginPath();c.moveTo(0,horizonY);
    for(let x=0;x<=W+20;x+=20){const y=horizonY-40-18*Math.sin(x*0.014+di)-10*Math.sin(x*0.035+di*2);c.lineTo(x,y);}c.lineTo(W,horizonY+4);c.lineTo(0,horizonY+4);c.closePath();c.fill();}
  if(d.coaster)drawCoaster(c,CX-d.side*openW*0.45,d);

function drawInnerCurtain(c,d){
  const x0=CX-openW-20,x1=CX+openW+20,top=stageTop,bot=horizonY+4;
  const g=c.createLinearGradient(x0,0,x1,0);const n=14;for(let i=0;i<=n;i++)g.addColorStop(i/n,i%2?'#7a0a16':'#4a050d');
  c.fillStyle=g;c.fillRect(x0,top,x1-x0,bot-top);
  const gl=c.createRadialGradient(CX,tieY,10,CX,tieY,openW*1.3);gl.addColorStop(0,'rgba(255,120,90,0.35)');gl.addColorStop(1,'rgba(255,120,90,0)');c.fillStyle=gl;c.fillRect(x0,top,x1-x0,bot-top);
  const sh=c.createLinearGradient(0,top,0,bot);sh.addColorStop(0,'rgba(0,0,0,0.45)');sh.addColorStop(0.3,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,0.35)');c.fillStyle=sh;c.fillRect(x0,top,x1-x0,bot-top);

function drawCoaster(c,ox,d){
  const x0=ox-90,x1=ox+90,base=horizonY-20;c.strokeStyle=d.coaster;
  const pts=[];for(let i=0;i<=48;i++){const u=i/48;pts.push([lerp(x0,x1,u),base-30-70*Math.pow(Math.abs(Math.sin(u*Math.PI*1.6+0.4)),1.4)-20*u]);}
  c.lineWidth=2;for(let i=0;i<=48;i+=3){c.beginPath();c.moveTo(pts[i][0],pts[i][1]);c.lineTo(pts[i][0],base+10);c.stroke();}
  c.lineWidth=4;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();
  c.lineWidth=1.5;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]+7):c.moveTo(p[0],p[1]+7));c.stroke();
}
/* stands, palmiers… devant la grande roue mais derrière les rideaux */
function drawScene(c,d){
  if(d.inner||!d.tents)return;
  if(d.beach){palm(c,CX-openW*0.62,horizonY-6,1,0.8);palm(c,CX+openW*0.66,horizonY-8,-1,0.75);}
  const xs=[-0.66,0.02,0.7],hs=[92,108,96],ws=[86,96,88];
  for(let i=0;i<3;i++)drawTent(c,CX+xs[i]*openW,horizonY-4,ws[i],hs[i],d.tents[i],d.snow,i);
  if(d.snow){snowman(c,CX-openW*0.25,horizonY-2,0.8);c.fillStyle='#ffffff';for(let x=CX-openW-20;x<CX+openW+20;x+=22){c.beginPath();c.arc(x,horizonY+2,10+((x*7)%7),Math.PI,0);c.fill();}}
}
function drawTent(c,x,by,w,h,cols,snow,idx){
  const bodyH=h*0.48,roofH=h*0.52,top=by-bodyH,n=6;
  for(let i=0;i<n;i++){c.fillStyle=cols[i%2];c.fillRect(x-w/2+i*w/n,top,w/n+0.6,bodyH);}
  c.fillStyle='rgba(30,10,20,0.8)';c.beginPath();c.moveTo(x-w*0.13,by);c.lineTo(x-w*0.13,by-bodyH*0.5);c.quadraticCurveTo(x,by-bodyH*0.95,x+w*0.13,by-bodyH*0.5);c.lineTo(x+w*0.13,by);c.closePath();c.fill();
  const px=x,py=top-roofH,bl=x-w/2-8,brr=x+w/2+8,m=8;
  for(let i=0;i<m;i++){c.fillStyle=cols[i%2];c.beginPath();c.moveTo(px,py);c.lineTo(lerp(bl,brr,i/m),top);c.lineTo(lerp(bl,brr,(i+1)/m),top);c.closePath();c.fill();}
  const sw=(brr-bl)/m;for(let i=0;i<m;i++){c.fillStyle=cols[(i+1)%2];c.beginPath();c.arc(bl+sw*(i+0.5),top,sw/2,0,Math.PI);c.fill();}
  c.strokeStyle='rgba(40,10,20,0.5)';c.lineWidth=1.5;c.beginPath();c.moveTo(bl,top);c.lineTo(px,py);c.lineTo(brr,top);c.stroke();
  if(snow){c.fillStyle='#ffffff';c.beginPath();c.moveTo(px,py-2);c.lineTo(lerp(px,bl,0.42),lerp(py,top,0.42));
    for(let k=0;k<=6;k++)c.lineTo(lerp(lerp(px,bl,0.42),lerp(px,brr,0.42),k/6),lerp(py,top,0.42)+((k%2)?6:2));
    c.lineTo(px,py-2);c.closePath();c.fill();}
  c.strokeStyle='#5a3a2a';c.lineWidth=2;c.beginPath();c.moveTo(px,py);c.lineTo(px,py-15);c.stroke();
  c.fillStyle=cols[0]==='#ffffff'?cols[1]:cols[0];c.beginPath();c.moveTo(px,py-15);c.lineTo(px+12,py-11);c.lineTo(px,py-7);c.closePath();c.fill();
  for(let i=0;i<=3;i++){addBulb(SCENE_BULBS,lerp(bl,px,i/4)+2,lerp(top,py,i/4)+3,BULB_COLS[(i+idx)%8],0,i+idx*7,2.6);addBulb(SCENE_BULBS,lerp(brr,px,i/4)-2,lerp(top,py,i/4)+3,BULB_COLS[(i+idx+3)%8],0,i+idx*7+3,2.6);}
}
function palm(c,x,by,f,s){
  c.save();c.translate(x,by);c.scale(f*s,s);
  c.strokeStyle='#7a4a22';c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(20,-90,8,-190);c.stroke();
  c.fillStyle='#2f9e44';for(let k=0;k<6;k++){c.save();c.translate(8,-190);c.rotate(-2.6+k*0.75);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(40,-24,86,6);c.quadraticCurveTo(40,-4,0,0);c.fill();c.restore();}
  c.fillStyle='#6a3a1a';c.beginPath();c.arc(4,-184,7,0,TAU);c.arc(14,-182,7,0,TAU);c.fill();
  c.restore();
}
function snowman(c,x,by,s){
  c.save();c.translate(x,by);c.scale(s,s);c.fillStyle='#ffffff';c.strokeStyle='rgba(90,110,160,0.6)';c.lineWidth=2;
  [[0,-22,24],[0,-60,17],[0,-86,12]].forEach(([dx,dy,r])=>{c.beginPath();c.arc(dx,dy,r,0,TAU);c.fill();c.stroke();});
  c.fillStyle='#222';c.beginPath();c.arc(-4,-89,2,0,TAU);c.arc(4,-89,2,0,TAU);c.fill();
  c.fillStyle='#ff8a1a';c.beginPath();c.moveTo(0,-85);c.lineTo(13,-83);c.lineTo(0,-81);c.fill();
  c.fillStyle='#d22f45';c.fillRect(-14,-76,28,6);c.fillStyle='#222';c.fillRect(-11,-112,22,16);c.fillRect(-16,-98,32,4);
  c.restore();
}
function pumpkin(c,x,y,r){
  c.fillStyle='#ff8a1a';for(const dx of [-0.5,0.5,0]){c.beginPath();c.ellipse(x+dx*r,y,r*0.62,r*0.8,0,0,TAU);c.fill();}
  c.strokeStyle='rgba(120,50,0,0.6)';c.lineWidth=1.5;c.beginPath();c.ellipse(x,y,r*0.3,r*0.8,0,0,TAU);c.stroke();
  c.fillStyle='#3a5a1a';c.fillRect(x-2,y-r*0.95,4,r*0.3);
  c.fillStyle='#ffe066';c.beginPath();c.moveTo(x-r*0.45,y-r*0.15);c.lineTo(x-r*0.2,y-r*0.35);c.lineTo(x-r*0.12,y-r*0.1);c.fill();
  c.beginPath();c.moveTo(x+r*0.45,y-r*0.15);c.lineTo(x+r*0.2,y-r*0.35);c.lineTo(x+r*0.12,y-r*0.1);c.fill();
  c.beginPath();c.moveTo(x-r*0.45,y+r*0.2);c.lineTo(x,y+r*0.45);c.lineTo(x+r*0.45,y+r*0.2);c.lineTo(x,y+r*0.3);c.closePath();c.fill();
}

  drawTVFrames(c,d);

function drawStageCurtains(c,d){
  const top=stageTop,bot=horizonY+2;
  c.save();
  const n=Math.round(W/24);const g=c.createLinearGradient(0,0,W,0);for(let i=0;i<=n;i++)g.addColorStop(i/n,i%2?d.curtain[1]:d.curtain[0]);
  c.fillStyle=g;c.fillRect(0,top,W,bot-top);
  const sh=c.createLinearGradient(0,top,0,bot);sh.addColorStop(0,'rgba(0,0,0,0.3)');sh.addColorStop(0.25,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,0.4)');c.fillStyle=sh;c.fillRect(0,top,W,bot-top);
  c.globalCompositeOperation='destination-out';c.fillStyle='#000';openingPath(c);c.fill();c.globalCompositeOperation='source-over';
  // plis qui se resserrent vers les embrasses
  const mid=stageTop+(tieY-stageTop)*0.5;
  for(const s of [-1,1]){

/* ---------- éléments animés ---------- */
const FX={clouds:[],birds:[],fw:[],fwT:0,snow:[],bats:[],fog:[],conf:[]};
function fxReset(d){
  FX.clouds=[];FX.birds=[];FX.fw=[];FX.fwT=0.5;FX.snow=[];FX.bats=[];FX.fog=[];FX.conf=[];
  const has=k=>d.fx&&d.fx.indexOf(k)>=0;
  const skyA=HDM.ready?20:stageTop+40,skyB=HDM.ready?iy(470):tieY-60;
  if(has('clouds'))for(let i=0;i<5;i++)FX.clouds.push({x:rnd(0,W),y:rnd(skyA,skyB),s:rnd(0.5,0.9),sp:rnd(6,14)});
  if(has('birds')||has('gulls'))for(let i=0;i<4;i++)FX.birds.push({x:rnd(0,W),y:rnd(skyA,skyB),sp:rnd(20,40),ph:rnd(0,TAU),col:has('gulls')?'#ffffff':'#3a1a3a'});
  if(has('snow'))for(let i=0;i<90;i++)FX.snow.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1.2,3.2),vy:rnd(25,60),ph:rnd(0,TAU)});
  if(has('bats'))for(let i=0;i<5;i++)FX.bats.push({x:rnd(0,W),y:rnd(stageTop+30,horizonY-120),vx:rnd(-50,50)||30,ph:rnd(0,TAU)});
  if(has('fog'))for(let i=0;i<4;i++)FX.fog.push({x:rnd(0,W),w:rnd(140,240),sp:rnd(8,18)});
  if(has('confetti'))for(let i=0;i<45;i++)FX.conf.push({x:rnd(0,W),y:rnd(0,H),vy:rnd(30,70),ph:rnd(0,TAU),col:BULB_COLS[(Math.random()*8)|0],r:rnd(0,TAU)});
}
function updateFx(dt,d){
  for(const c of FX.clouds){c.x+=c.sp*dt;if(c.x>W+120)c.x=-120;}
  for(const b of FX.birds){b.x+=b.sp*dt;if(b.x>W+40){b.x=-40;b.y=HDM.ready?rnd(20,iy(470)):rnd(stageTop+50,tieY-40);}}
  for(const s of FX.snow){s.y+=s.vy*dt;s.x+=Math.sin(T*1.3+s.ph)*14*dt;if(s.y>H+5){s.y=-5;s.x=rnd(0,W);}}
  for(const b of FX.bats){b.x+=b.vx*dt;b.y+=Math.sin(T*2+b.ph)*12*dt;if(b.x>W+40)b.x=-40;if(b.x<-40)b.x=W+40;}
  for(const f of FX.fog){f.x+=f.sp*dt;if(f.x-f.w>W)f.x=-f.w;}
  for(const c of FX.conf){c.y+=c.vy*dt;c.x+=Math.sin(T*2+c.ph)*20*dt;c.r+=dt*4;if(c.y>H+5){c.y=-5;c.x=rnd(0,W);}}
  if(d&&d.fx&&d.fx.indexOf('fireworks')>=0){FX.fwT-=dt;if(FX.fwT<=0){FX.fwT=rnd(0.7,1.6);
    if(HDM.ready)firework(rnd(20,W-20),rnd(20,iy(440)));
    else if(apexY>70&&Math.random()<0.35)firework(rnd(30,W-30),rnd(18,apexY-8));else firework(CX+rnd(-openW*0.8,openW*0.8),rnd(stageTop+60,tieY-50));}}
  for(const p of FX.fw){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=45*dt;p.vx*=1-dt*0.8;p.vy*=1-dt*0.4;p.life-=dt;}
  if(FX.fw.length&&FX.fw[0].life<=0)FX.fw=FX.fw.filter(p=>p.life>0);
}
function firework(x,y,big){
  const cols=[['#ff4fa0','#ffd1ec'],['#ffd23f','#fff3b0'],['#4fe0ff','#d0f8ff'],['#7dff8a','#e0ffe4'],['#c08aff','#efe0ff'],['#ff7a3d','#ffe0c8']][(Math.random()*6)|0];
  const n=big?60:36;const sp0=big?190:110;for(let i=0;i<n;i++){const a=i/n*TAU+rnd(-0.05,0.05),sp=rnd(sp0*0.45,sp0);FX.fw.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(1,1.6),max:1.6,col:cols[i%2]});}
}
function drawFar(d,t){
  if(d.inner)drawCurtainSpots(t);
  for(const c of FX.clouds){ctx.fillStyle='rgba(255,255,255,0.92)';const s=c.s;for(const [dx,dy,r] of [[0,0,26],[24,-10,22],[48,0,24],[22,8,22],[-22,6,18]]){ctx.beginPath();ctx.arc(c.x+dx*s,c.y+dy*s,r*s,0,TAU);ctx.fill();}}

  for(const b of FX.birds){const f=Math.sin(t*8+b.ph)*5;ctx.strokeStyle=b.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x-9,b.y-f);ctx.quadraticCurveTo(b.x-4,b.y-3,b.x,b.y);ctx.quadraticCurveTo(b.x+4,b.y-3,b.x+9,b.y-f);ctx.stroke();}

  c.lineWidth=1.8;c.globalAlpha=0.9;for(let i=0;i<16;i++){const a=a0+i*TAU/16;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);c.stroke();}

  const gc=['#ff4b5c','#ffd23f','#2f8bff','#3fcf6a','#ff8ad8','#ff9a3c'];

  if(cfg.reverse){hp.flip-=dt;if(hp.flip<=0&&Math.random()<cfg.flipRate*dt){hp.dir*=-1;hp.flip=2;}}
  if(cfg.ease){const u=hp.x/cfg.range;sp*=0.45+0.9*(1-u*u);}
  hp.x+=hp.dir*sp*dt;
  if(hp.x>cfg.range){hp.x=cfg.range;hp.dir=-1;}else if(hp.x<-cfg.range){hp.x=-cfg.range;hp.dir=1;}

function launch(zt,xt,assist){

  if(state==='play'){game.throws++;firstThrowDone=true;}
}
function updateWorld(dt,playing){

  world.net.kick*=Math.exp(-3.2*dt);world.net.t+=dt;
  for(const b of world.balls){if(!b.dead){stepBall(b,hp,dt,EV,world.wind.v,world.lama);if(Math.abs(b.y-hp.y)<0.3)b.minD=Math.min(b.minD,Math.hypot(b.x-hp.x,b.z-hp.z));}}
  for(const b of world.balls){
    if(b.dead){b.fade-=dt*3;continue;}
    const p=proj(b.x,b.y,b.z);
    if(!b.landed&&!(b.scored&&b.y<hp.y-0.4)){b.trail.push({x:p.x,y:p.y});if(b.trail.length>11)b.trail.shift();}else if(b.trail.length)b.trail.shift();
    if(b.gold&&Math.random()<dt*30)spark(p.x+rnd(-8,8),p.y+rnd(-8,8),1,['#fff6a0','#ffd23f'],{type:'star',g:30,min:5,max:30,life:0.6});
    if(b.fire&&!b.landed){const r=BR*p.s,n=Math.random()<dt*90?2:0;spark(p.x+rnd(-r,r)*0.5,p.y+rnd(-r,r)*0.5,n,['#ffd23f','#ff8a1a','#ff4a0a'],{type:'flame',g:-140,min:5,max:35,life:0.4,size:r*0.085});}
    if(b.t>4.5||p.y>H+80||p.x<-80||p.x>W+80||(b.landed&&b.t>2.4)||(b.landed&&b.bounces>4&&b.t>1.6)){b.dead=true;b.fade=1;if(!b.scored&&!b.missed)onMiss(b);}
  }
  for(let i=world.balls.length-1;i>=0;i--)if(world.balls[i].dead&&world.balls[i].fade<=0)world.balls.splice(i,1);
  if(!world.ready){world.spawnT-=dt;if(world.spawnT<=0){world.ready=true;world.readyAge=0;
    const r=Math.random(),c=world.cfg,can=playing&&!world.lastSpecial;
    world.readyGold=can&&r<c.gold;world.readyClock=can&&!world.readyGold&&r<c.gold+c.clock;world.lastSpecial=world.readyGold||world.readyClock;
    if(world.readyGold)SFX.goldSpawn();if(world.readyClock)SFX.clockSpawn();}}
  else{world.readyAge+=dt;if(world.readyGold&&Math.random()<dt*20){spark(CX+rnd(-30,30),ballSY+rnd(-30,30),1,['#fff6a0','#ffd23f'],{type:'star',g:-20,min:5,max:25,life:0.7});}}
}

  if(b.y<hp.y+0.03){const d=Math.hypot(b.x-hp.x,b.z-hp.z);if(d<RR+BR*0.5&&b.y>hp.y-0.75)return 2;if(b.z>hp.z)return 1;}
  return b.z>=ZR?3:4;
}
function drawShadow(x,y,z,a){
  const p=proj(x,FLOOR_Y,z);const h=Math.max(0,y-START_Y);const k=clamp(1-h*0.4,0.25,1);
  ctx.fillStyle='rgba(0,0,0,'+(0.3*k*a).toFixed(3)+')';ctx.beginPath();ctx.ellipse(p.x,p.y,BR*p.s*(1.25-0.35*k),BR*p.s*0.32*(1.25-0.35*k),0,0,TAU);ctx.fill();
}

  const it=proj(hp.x-0.17,hp.y+0.3,BZ),ib=proj(hp.x+0.17,hp.y+0.02,BZ);ctx.strokeStyle='#e5322d';ctx.lineWidth=Math.max(3,0.035*s);ctx.strokeRect(it.x,it.y,ib.x-it.x,ib.y-it.y);
  for(const [u,v] of [[0.12,0.18],[0.88,0.18]]){starPath(ctx,tl.x+bw*u,tl.y+bh*v,6,2.8);ctx.fillStyle='#ffc61a';ctx.fill();}
  // ampoules tout autour du cadre
  const ix=tl.x-fr/2,iy=tl.y-fr/2,iw=bw+fr,ih=bh+fr,nx=Math.max(4,Math.round(iw/15)),ny=Math.max(3,Math.round(ih/15));let i=0;
  for(let q=0;q<=nx;q++){const x=ix+q*iw/nx;drawBulbAt(ctx,x,iy,WARM[q%4],bulbOn(0,i++,t),2.6);drawBulbAt(ctx,x,iy+ih,WARM[(q+2)%4],bulbOn(0,i++,t),2.6);}
  for(let q=1;q<ny;q++){const y=iy+q*ih/ny;drawBulbAt(ctx,ix,y,WARM[q%4],bulbOn(0,i++,t),2.6);drawBulbAt(ctx,ix+iw,y,WARM[(q+1)%4],bulbOn(0,i++,t),2.6);}

function rimHalf(hp,back){
  const N=32,pts=[];for(let i=0;i<=N;i++){const a=(back?0:Math.PI)+i*Math.PI/N;pts.push(proj(hp.x+RR*Math.cos(a),hp.y,hp.z+RR*Math.sin(a)));}
  const s=pts[N>>1].s,path=dy=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y+dy):ctx.moveTo(p.x,p.y+dy));};
  ctx.lineCap='round';ctx.lineJoin='round';
  if(back){path(0);ctx.strokeStyle='#4a1003';ctx.lineWidth=0.05*s;ctx.stroke();path(0);ctx.strokeStyle='#b4360c';ctx.lineWidth=0.033*s;ctx.stroke();
    path(-0.009*s);ctx.strokeStyle='rgba(255,170,120,0.4)';ctx.lineWidth=0.009*s;ctx.stroke();return;}
  path(0.016*s);ctx.strokeStyle='rgba(20,0,0,0.28)';ctx.lineWidth=0.05*s;ctx.stroke();

  const q=pts[Math.round(N*0.3)];ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.ellipse(q.x,q.y-0.013*s,0.035*s,0.0065*s,-0.1,0,TAU);ctx.fill();

const NET_N=16,NET_ROWS=[[1,0],[0.9,-0.11],[0.8,-0.22],[0.7,-0.33],[0.62,-0.44]];
function netRows(hp){
  const k=world.net.kick,wob=Math.sin(world.net.t*18)*k,sx=clamp(-hp.vx*0.09,-0.07,0.07),sz=clamp(-(hp.vz||0)*0.09,-0.07,0.07);
  const inside=world.balls.filter(b=>b.scored&&!b.dead&&b.y<hp.y+0.05&&b.y>hp.y-0.7);
  return NET_ROWS.map(([rf,y0],ri)=>{
    const u=ri/(NET_ROWS.length-1);let r=RR*rf*(1+0.05*wob*u),y=y0-0.12*k*u+0.03*wob*u,cx=hp.x+sx*u,cz=hp.z+sz*u;
    for(const b of inside){const dy=b.y-(hp.y+y),span=BR*1.35;if(Math.abs(dy)<span){const need=BR*1.04*Math.sqrt(1-(dy/span)*(dy/span));if(need>r*0.9){r=Math.max(r,need+0.012);cx+=(b.x-cx)*0.6;cz+=(b.z-cz)*0.6;y-=0.03;}}}
    const a=[];for(let i=0;i<NET_N;i++){const an=i*TAU/NET_N+(ri%2?Math.PI/NET_N:0);a.push({a:an,p:proj(cx+r*Math.cos(an),hp.y+y,cz+r*Math.sin(an))});}return a;});
}
function drawNet(hp,back){
  const rows=netRows(hp),N=NET_N,s=sAt(hp.z),segs=[];
  for(let ri=0;ri<rows.length-1;ri++)for(let i=0;i<N;i++){const p0=rows[ri][i];if((Math.sin(p0.a)>0)!==back)continue;
    const j=ri%2?(i+1)%N:(i-1+N)%N;segs.push(p0.p,rows[ri+1][i].p,p0.p,rows[ri+1][j].p);}
  const lr=rows[rows.length-1];for(let i=0;i<N;i++){const p0=lr[i],p1=lr[(i+1)%N];if((Math.sin(p0.a+Math.PI/N)>0)!==back)continue;segs.push(p0.p,p1.p);}
  const stroke=(col,lw)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();for(let i=0;i<segs.length;i+=2){ctx.moveTo(segs[i].x,segs[i].y);ctx.lineTo(segs[i+1].x,segs[i+1].y);}ctx.stroke();};
  ctx.lineCap='round';
  if(back)stroke('rgba(165,165,185,0.6)',Math.max(1.1,0.0085*s));
  else{stroke('rgba(40,15,30,0.3)',Math.max(2.3,0.017*s));stroke('#ffffff',Math.max(1.3,0.0095*s));}

function drawWorld(){
  const hp=world.hoop;
  for(const b of world.balls)drawShadow(b.x,b.y,b.z,b.dead?Math.max(0,b.fade):1);
  if(world.ready&&!(state==='play'&&ballsLeft()<=0)){const p=proj(START_X,START_Y,0),a=clamp(world.readyAge/0.2,0,1);ctx.fillStyle='rgba(0,0,0,'+(0.35*a).toFixed(3)+')';ctx.beginPath();ctx.ellipse(p.x,podY-2,BR*p.s*1.05,BR*p.s*0.28,0,0,TAU);ctx.fill();}
  const layers=[[],[],[],[],[]];

// Il applique les mêmes règles que le jeu : séries, frénésie, ballons doré et horloge, vent (compensé à ~80 %).
function botRun(Lv,sx,sz,pace,stats,over){
  const cfg=Object.assign(levelCfg(Lv),over||{}),hp={x:0,y:RH,z:HZ,vx:0,vy:0,vz:0,ph:rnd(0,TAU),dir:1,pause:0,t:0,flip:1},wind={v:0,to:0,t:0,k:0},lm={x:-LAMA_RANGE,dir:1,t:0,hit:0,pause:0,away:rnd(1,2.5),on:false};

    floor(b){if(!b.scored&&!b.missed){b.missed=true;streak=0;}}};

    if(canThrow&&t>=next){
      const lag=0.12;let px=hp.x+hp.vx*(FT+lag);for(let k=0;k<4;k++){if(px>cfg.range)px=2*cfg.range-px;else if(px<-cfg.range)px=-2*cfg.range-px;}
      const pz=HZ+(cfg.swing?cfg.swing*Math.sin((hp.t+FT+lag)*SWING_W+hp.ph):0);

      if(lm.on&&!(lm.away>0.3)){const tc=ZR/zt*FT,lx=lm.away>0?-lm.dir*LAMA_RANGE:lm.x+lm.dir*cfg.lama*tc,bx=xt*ZR/zt;if(Math.abs(bx-lx)<LAMA_W/2+BR+0.04&&Math.random()<care)wait=true;}
      if(wait)next=t+0.12;
      else{next=t+pace;thrown++;
        const r=Math.random(),can=!lastSp,gold=can&&r<cfg.gold,clock=can&&!gold&&r<cfg.gold+cfg.clock;lastSp=gold||clock;
        balls.push(makeBall(zt,xt,0,gold,clock));}}
    for(const b of balls)if(!b.landed||b.t<2.5)stepBall(b,hp,dt,ev,wind.v,lm);
    balls=balls.filter(b=>b.t<3);t+=dt;
    if(cfg.balls&&thrown>=cfg.balls&&!balls.some(b=>!b.scored&&!b.missed&&!b.landed))break;
  }
  if(stats)return {score,best,made,thrown};
  return score;
}
