<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma Maison</title>
  <meta name="description" content="Tableau de bord domotique : lumières, volets, chauffage, serrures, scènes et automatisations.">
  <meta name="theme-color" content="#11151c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="main">
      <header class="topbar">
        <div class="brand">
          <span class="brand-logo" id="brandLogo"></span>
          <span class="brand-name">Ma Maison</span>
        </div>
        <div class="topbar-right">
          <span class="status" id="status" role="status"></span>
          <span class="clock" id="clock"></span>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-act="close-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalCard"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/format.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ha.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
