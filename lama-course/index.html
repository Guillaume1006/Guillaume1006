<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lama Course</title>
<style>
html,body{margin:0;height:100%;background:#120a1f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style></head>
<body><canvas id="c"></canvas>
<script>
"use strict";
// ---------- constantes ----------
const W = 540, H = 960, MAX_LEVEL = 60;
const PX = 270, PY = 845;                       // pivot du canon
const FONT = "'Trebuchet MS',Verdana,sans-serif";
const LANES = 5, LANE_Y0 = 228, LANE_H = 48;    // couloirs de course en haut du stand
const START_X = 146, FINISH_X = 402;            // départ et arrivée (centre du lama)
const ME = 4;                                   // ton lama : couloir du bas
const RAIL_Y = 676;                             // rail du récipient
const RATE = 50;                                          // gouttes du jet d'eau par seconde
const fillSecs = l => 6 + 4 * (l - 1) / (MAX_LEVEL - 1);     // secondes de jet parfait pour remplir le récipient
const raceTime = l => 26 - 9 * (l - 1) / (MAX_LEVEL - 1);    // durée de course du meilleur adversaire (s)
const jarSpeed = l => 45 + 100 * (l - 1) / (MAX_LEVEL - 1);  // vitesse max du chariot (elle augmente aussi pendant la course)
// récipients en verre : profil (hauteur relative, demi-largeur), hauteur, ouverture
const JARS = [
  { name: 'le grand bocal', h: 62, p: [[0, 28], [.08, 33], [.45, 38], [.82, 36], [.9, 32], [1, 32]] },
  { name: 'le pot', h: 68, p: [[0, 22], [.1, 28], [.5, 31], [.8, 24], [.9, 25], [1, 25]] },
  { name: 'le vase', h: 76, p: [[0, 16], [.12, 24], [.42, 30], [.74, 17], [.9, 17], [1, 19]] },
  { name: 'la bouteille', h: 86, p: [[0, 22], [.1, 25], [.55, 25], [.7, 17], [.8, 15], [1, 15]] }
];
JARS.forEach(j => { j.m = j.p[j.p.length - 1][1]; j.r = Math.max(...j.p.map(q => q[1])); });
const jarFor = l => JARS[Math.min(3, Math.floor((l - 1) / 15))];
const RACERS = [
  { col: '#2fb7a6', dark: '#11705f', fur: ['#fff8ee', '#d6c0a2'], hat: ['#e3222f', '#ffc933', '#2fb7a6'] },
  { col: '#ffc933', dark: '#a87400', fur: ['#e6c094', '#a87a4c'], hat: ['#7a4cc2', '#2fb7a6', '#ffc933'] },
  { col: '#7a4cc2', dark: '#432280', fur: ['#f6efe8', '#c4b4a4'], hat: ['#ffc933', '#e3222f', '#7a4cc2'] },
  { col: '#ff8a2a', dark: '#b2500c', fur: ['#cfa070', '#8a5e3a'], hat: ['#2fb7a6', '#ffc933', '#e3222f'] },
  { col: '#ff5a9a', dark: '#b8225e', fur: ['#fffaf4', '#e0cab0'], hat: ['#ff5a9a', '#ffc933', '#7a4cc2'] }
];

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0, ext = 0;
const EXT = 170;   // décor ajouté en haut et en bas sur les écrans plus allongés que le jeu (plein écran, sans bandes)
function resize() {
  const d = devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
  scale = Math.min(cv.width / W, cv.height / H);
  if (cv.height / cv.width > H / W) scale = Math.max(cv.width / W, cv.height / (H + 2 * EXT));
  ext = Math.min(EXT, Math.max(0, (cv.height / scale - H) / 2));
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- outils de dessin ----------
const ell = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); };
const circ = (x, y, r) => ell(x, y, r, r);
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const stopsOf = (g, stops) => { stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const vgrad = (y0, y1, stops) => stopsOf(ctx.createLinearGradient(0, y0, 0, y1), stops);
const lg = (x0, y0, x1, y1, stops) => stopsOf(ctx.createLinearGradient(x0, y0, x1, y1), stops);
const rg = (x0, y0, r0, x1, y1, r1, stops) => stopsOf(ctx.createRadialGradient(x0, y0, r0, x1, y1, r1), stops);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let Q = 2;   // résolution des calques pré-rendus (pixels par unité), ajustée à l'écran
function layer(fn, w = W, h = H, k = Q) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
  const g = c.getContext('2d'); g.scale(k, k);
  const prev = ctx; ctx = g; fn(); ctx = prev; return c;
}
// sprite pré-rendu dont le repère local couvre [x0, x0 + w] × [y0, y0 + h]
function sprite(fn, x0, y0, w, h, k = Q) { return { c: layer(() => { ctx.translate(-x0, -y0); fn(); }, w, h, k), x0, y0, w, h }; }
const put = (s, x = 0, y = 0) => ctx.drawImage(s.c, x + s.x0, y + s.y0, s.w, s.h);
function text(s, x, y, size, col = '#fff', align = 'center', stroke = '#3a1030') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function softShadow(x, y, rx, ry, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  ctx.fillStyle = rg(0, 0, 0, 0, 0, rx, [[0, `rgba(0,0,0,${a})`], [1, 'rgba(0,0,0,0)']]); circ(0, 0, rx); ctx.restore();
}
function grain(x, y, w, h, alpha, n, vertical) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = x + rnd() * w, b = y + rnd() * h, len = 20 + rnd() * 70, wob = (rnd() - .5) * 4;
    ctx.strokeStyle = rnd() < .75 ? `rgba(55,22,4,${alpha * rnd()})` : `rgba(255,220,160,${alpha * .6 * rnd()})`; ctx.lineWidth = .5 + rnd() * 1.1;
    ctx.beginPath(); if (vertical) { ctx.moveTo(a, b); ctx.quadraticCurveTo(a + wob, b + len / 2, a, b + len); } else { ctx.moveTo(a, b); ctx.quadraticCurveTo(a + len / 2, b + wob, a + len, b); } ctx.stroke();
  }
  ctx.restore();
}
function fur(cx, cy, rx, ry, n, light, dark) {
  ctx.lineCap = 'round'; ctx.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.283, k = .9 + .25 * ((i * 7) % 5) / 5, x = cx + Math.cos(a) * rx * k, y = cy + Math.sin(a) * ry * k, l = 3 + (i % 3);
    ctx.strokeStyle = i % 2 ? light : dark; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a + .3) * l, y + Math.sin(a + .3) * l); ctx.stroke();
  }
}

// ---------- lamas ----------
function llamaHead(x, y, s, hatCols, noNeck) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (const k of [-1, 1]) {
    ctx.fillStyle = rg(k * 15, -34, 2, k * 17, -34, 22, [[0, '#fffaf2'], [1, '#d8c3a6']]); ell(k * 17, -34, 7.5, 19, k * 0.18);
    ctx.fillStyle = rg(k * 17, -32, 1, k * 17, -32, 11, [[0, '#ffc7cf'], [1, '#d98a98']]); ell(k * 17, -31, 3.6, 12, k * 0.18);
  }
  if (!noNeck) { ctx.fillStyle = lg(-14, 0, 14, 0, [[0, '#d8c3a6'], [.35, '#fff6ea'], [.7, '#f1e2cf'], [1, '#cdb698']]); rr(-14, 12, 28, 46, 12); ctx.fill();
  softShadow(0, 14, 24, 6, .25); }
  ctx.fillStyle = rg(-7, -10, 3, 0, 0, 36, [[0, '#ffffff'], [.6, '#f8eee0'], [1, '#d3bd9f']]); ell(0, 0, 26.5, 30.5);
  fur(0, -4, 25, 28, 48, 'rgba(255,255,255,.7)', 'rgba(150,120,90,.25)');
  ctx.fillStyle = rg(0, -22, 2, 0, -22, 14, [[0, '#ffffff'], [1, '#f1e4d2']]); ell(-12, -19, 9, 8); ell(12, -19, 9, 8); ell(0, -25, 11, 8);
  for (const k of [-1, 1]) {
    ctx.fillStyle = '#fffdf8'; ell(k * 10, -3, 6.8, 7.6);
    ctx.strokeStyle = 'rgba(70,40,20,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(k * 10, -3, 6.8, 7.6, 0, 0, 6.283); ctx.stroke();
    ctx.fillStyle = rg(k * 10, -2, .5, k * 10, -2, 5.5, [[0, '#7a4524'], [.6, '#3d1f0e'], [1, '#1a0a04']]); circ(k * 10, -2, 5);
    ctx.fillStyle = '#000'; circ(k * 10, -2, 2.4);
    ctx.fillStyle = 'rgba(255,255,255,.95)'; circ(k * 10 + 1.8, -4.2, 1.9); ctx.fillStyle = 'rgba(255,255,255,.5)'; circ(k * 10 - 1.6, 0, 1);
    ctx.strokeStyle = 'rgba(42,18,8,.55)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.arc(k * 10, -3, 7.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.lineWidth = .9; for (let i = 0; i < 3; i++) { const a = Math.PI * (1.3 + i * .2); ctx.beginPath(); ctx.moveTo(k * 10 + Math.cos(a) * 7, -3 + Math.sin(a) * 7.4); ctx.lineTo(k * 10 + Math.cos(a) * 9 + k * 1, -3 + Math.sin(a) * 9.4); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,140,150,.28)'; ell(k * 17, 8, 6, 4);
  }
  ctx.fillStyle = rg(0, 11, 1, 0, 13, 15, [[0, '#fbe9df'], [1, '#e2c4b4']]); ell(0, 13, 14.5, 11.5);
  ctx.fillStyle = rg(-1, 7, .5, 0, 8, 6, [[0, '#f5a0b0'], [1, '#c8647a']]); ell(0, 8.5, 5, 3.4);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ell(-1.4, 7.4, 1.6, .9);
  ctx.strokeStyle = '#9a5048'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 11); ctx.lineTo(0, 15); ctx.moveTo(-8, 15); ctx.quadraticCurveTo(0, 24, 8, 15); ctx.stroke();
  ctx.fillStyle = '#e8506a'; ell(0, 19.5, 5, 3);
  if (hatCols) {
    const [a, b, c] = hatCols;
    const dome = () => { ctx.beginPath(); ctx.moveTo(-27, -18); ctx.quadraticCurveTo(-27, -50, 0, -50); ctx.quadraticCurveTo(27, -50, 27, -18); ctx.closePath(); };
    const g = ctx.createLinearGradient(-26, 0, 26, 0);
    const n = 6; for (let i = 0; i < n; i++) { const col = [a, b, c][i % 3]; g.addColorStop(i / n, col); g.addColorStop((i + 1) / n - 0.001, col); }
    ctx.fillStyle = g; dome(); ctx.fill();
    ctx.fillStyle = rg(-8, -42, 2, 0, -30, 40, [[0, 'rgba(255,255,255,.4)'], [.5, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,.35)']]); dome(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = .8; for (let i = -4; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i * 6, -48); ctx.lineTo(i * 6.6, -20); ctx.stroke(); }
    ctx.fillStyle = c; rr(-28, -20, 56, 7, 3); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.2)'; rr(-28, -15, 56, 2, 1); ctx.fill();
    ctx.fillStyle = rg(-1, -53, 1, 0, -52, 6, [[0, '#ff7a7a'], [1, a]]); circ(0, -52, 5.5);
    for (const k of [-1, 1]) { ctx.fillStyle = b; ell(k * 29, -6, 4, 12, k * 0.1); ctx.fillStyle = a; circ(k * 29, 7, 3.2); }
  }
  for (let i = 0; !noNeck && i < 7; i++) {
    const bx = -18 + i * 6, by = 41 + Math.abs(i - 3) * -1.2, col = ['#e8506a', '#ffc933', '#2fb7a6'][i % 3];
    ctx.fillStyle = rg(bx - 1, by - 1, .3, bx, by, 4, [[0, '#fff'], [.3, col], [1, 'rgba(0,0,0,.5)']]); circ(bx, by, 3.8);
  }
  ctx.restore();
}
// tête de lama vue de dos (elle regarde vers les cibles)
function llamaHeadBack(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (const k of [-1, 1]) {
    ctx.fillStyle = rg(k * 15, -34, 2, k * 17, -34, 24, [[0, '#fffaf2'], [1, '#d3bd9f']]); ell(k * 17, -34, 8, 20, k * 0.18);
    ctx.fillStyle = 'rgba(247,176,190,.5)'; ell(k * 14.5, -33, 2.2, 13, k * 0.18);
  }
  ctx.fillStyle = rg(-6, -12, 3, 0, 0, 36, [[0, '#fffdf8'], [.55, '#f4e8d6'], [1, '#c8b190']]); ell(0, 0, 27, 30.5);
  fur(0, -2, 26, 29, 60, 'rgba(255,255,255,.7)', 'rgba(140,110,80,.28)');
  ctx.fillStyle = rg(0, -24, 2, 0, -22, 14, [[0, '#ffffff'], [1, '#f1e4d2']]); ell(-8, -24, 8, 7); ell(8, -24, 8, 7); ell(0, -29, 9, 6);
  ctx.strokeStyle = 'rgba(150,120,90,.3)'; ctx.lineWidth = .9; for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(i * 3.5, -26); ctx.quadraticCurveTo(i * 4.6, 0, i * 3.2, 28); ctx.stroke(); }
  ctx.strokeStyle = vgrad(-2, 12, [[0, '#ff4a56'], [1, '#8a1020']]); ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(0, 6, 26.5, 9, 0, .05 * Math.PI, .95 * Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,230,200,.7)'; ctx.setLineDash([2, 3]); ctx.lineWidth = .7; ctx.beginPath(); ctx.ellipse(0, 6, 26.5, 9, 0, .05 * Math.PI, .95 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
  [[-24, 9, '#ffc933'], [24, 9, '#2fb7a6'], [0, 15, '#e3222f']].forEach(([bx, by, c]) => { ctx.fillStyle = rg(bx - 1, by - 1, .3, bx, by, 4, [[0, '#fff'], [.35, c], [1, 'rgba(0,0,0,.55)']]); circ(bx, by, 3.6); });
  ctx.restore();
}
function plush(x, y, s, body, scarf, hangTo) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (hangTo !== undefined) { ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 1.5 / s; ctx.beginPath(); ctx.moveTo(10, -38); ctx.lineTo(10, (hangTo - y) / s); ctx.stroke(); }
  softShadow(2, 26, 30, 5, .3);
  const f = (cx, cy, rx, ry) => { ctx.fillStyle = rg(cx - rx * .3, cy - ry * .4, 1, cx, cy, Math.max(rx, ry) * 1.1, [[0, 'rgba(255,255,255,.55)'], [.5, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,.28)']]); ell(cx, cy, rx, ry); };
  for (const lx of [-14, -5, 8, 17]) { ctx.fillStyle = body; rr(lx - 4, 6, 8, 18, 4); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(lx - 4, 6, 8, 18, 4); ctx.fill(); }
  ctx.fillStyle = body; ell(0, 0, 25, 17); f(0, 0, 25, 17);
  ctx.fillStyle = body; rr(12, -34, 14, 36, 7); ctx.fill(); ell(21, -38, 13, 11, -0.2); f(21, -38, 13, 11); ell(28, -34, 8, 6); f(28, -34, 8, 6);
  fur(0, 0, 24, 16, 36, 'rgba(255,255,255,.35)', 'rgba(0,0,0,.14)'); fur(21, -38, 12, 10, 24, 'rgba(255,255,255,.35)', 'rgba(0,0,0,.14)');
  ctx.fillStyle = body; rr(14, -62, 6, 18, 3); ctx.fill(); rr(23, -61, 6, 17, 3); ctx.fill();
  ctx.fillStyle = '#f2a7b3'; rr(15.5, -58, 3, 10, 1.5); ctx.fill(); rr(24.5, -57, 3, 10, 1.5); ctx.fill();
  ctx.fillStyle = '#1a0e08'; circ(22, -41, 2.4); circ(34, -35, 1.8); ctx.fillStyle = 'rgba(255,255,255,.9)'; circ(22.8, -41.8, .8);
  ctx.fillStyle = scarf; rr(10, -24, 18, 8, 4); ctx.fill(); rr(14, -20, 6, 14, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(11, -23, 16, 2.5, 1); ctx.fill();
  ctx.restore();
}
function cactus(x, y, s, col = '#3d7a45') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const arms = () => { rr(-8, -70, 16, 70, 8); ctx.fill(); rr(-24, -48, 10, 28, 5); ctx.fill(); rr(-24, -28, 20, 9, 4); ctx.fill(); rr(14, -58, 10, 30, 5); ctx.fill(); rr(4, -36, 20, 9, 4); ctx.fill(); };
  ctx.fillStyle = col; arms();
  ctx.fillStyle = lg(-24, 0, 24, 0, [[0, 'rgba(255,255,255,.22)'], [.5, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,.4)']]); arms();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; for (const k of [-4, 0, 4]) { ctx.beginPath(); ctx.moveTo(k, -66); ctx.lineTo(k, -4); ctx.stroke(); }
  ctx.restore();
}
function diamonds(x, y0, y1, step, cols) {
  let i = 0; for (let y = y0; y < y1; y += step, i++) {
    const c = cols[i % cols.length];
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + step / 2, y + step / 2); ctx.lineTo(x, y + step); ctx.lineTo(x - step / 2, y + step / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + step / 2, y + step / 2); ctx.lineTo(x, y + step / 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.moveTo(x, y + step); ctx.lineTo(x - step / 2, y + step / 2); ctx.lineTo(x, y + step / 2); ctx.fill();
  }
}

// ---------- décor statique ----------
const bulbs = [];
function drawBack() {
  ctx.fillStyle = '#1a1030'; ctx.fillRect(0, 0, W, H);
  const x0 = 100, x1 = 440, y0 = 130, y1 = 800;
  // paysage peint, légèrement flou (profondeur de champ)
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip(); ctx.filter = 'blur(1.6px)';
  ctx.fillStyle = vgrad(y0, y1, [[0, '#1f4f9e'], [.25, '#5b7fd0'], [.42, '#b678b8'], [.58, '#ffa560'], [1, '#c2602a']]); ctx.fillRect(x0 - 10, y0 - 10, x1 - x0 + 20, y1 - y0 + 20);
  ctx.fillStyle = lg(0, 470, 0, 640, [[0, '#8a5a98'], [1, '#5a3a68']]); ctx.beginPath(); ctx.moveTo(x0, 560); ctx.lineTo(170, 500); ctx.lineTo(240, 545); ctx.lineTo(330, 486); ctx.lineTo(410, 540); ctx.lineTo(x1, 515); ctx.lineTo(x1, 800); ctx.lineTo(x0, 800); ctx.fill();
  ctx.fillStyle = 'rgba(255,170,100,.28)'; ctx.beginPath(); ctx.moveTo(330, 486); ctx.lineTo(305, 520); ctx.lineTo(342, 510); ctx.fill();
  ctx.fillStyle = vgrad(560, 800, [[0, '#e08a48'], [1, '#a84a20']]); ctx.beginPath(); ctx.moveTo(x0, 600); ctx.quadraticCurveTo(220, 560, 300, 596); ctx.quadraticCurveTo(380, 625, x1, 580); ctx.lineTo(x1, 800); ctx.lineTo(x0, 800); ctx.fill();
  cactus(128, 640, 1); cactus(418, 620, 1.1); cactus(200, 610, .6, '#336a3c'); cactus(352, 600, .7, '#336a3c');
  ctx.restore();
  // enseigne en bois
  softShadow(270, 214, 130, 10, .4);
  ctx.fillStyle = lg(0, 142, 0, 208, [[0, '#8a4a22'], [1, '#4a2410']]); rr(150, 142, 240, 66, 12); ctx.fill();
  grain(150, 142, 240, 66, .5, 40);
  ctx.fillStyle = lg(0, 147, 0, 203, [[0, '#f0b84a'], [1, '#c8842a']]); rr(155, 147, 230, 56, 9); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(158, 149, 224, 5, 3); ctx.fill();
  text('LAMA COURSE', 270, 177, 31, '#fff', 'center', '#7a2230');
  ctx.strokeStyle = '#4a2410'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(180, 142); ctx.lineTo(190, 130); ctx.moveTo(360, 142); ctx.lineTo(350, 130); ctx.stroke();
  // piste de course : cadre en bois et six couloirs de sable
  const tx0 = 104, tx1 = 436, ty0 = LANE_Y0 - 8, ty1 = LANE_Y0 + LANES * LANE_H + 8;
  softShadow(270, ty1 + 12, 175, 12, .55);
  ctx.fillStyle = vgrad(ty0, ty1, [[0, '#8a4a22'], [1, '#4a2410']]); rr(tx0, ty0, tx1 - tx0, ty1 - ty0, 8); ctx.fill();
  grain(tx0, ty0, tx1 - tx0, ty1 - ty0, .5, 50);

  else if (state === 'won') { overlayWin('Victoire !', ['Ton lama gagne la course !', 'Prochain : ' + modeName(modeFor(level + 1), level + 1)], 'Touche pour continuer'); winStars(); }
  else if (state === 'lost') overlay('Perdu !', ['Le lama n°' + (winner + 1) + ' a gagné', myRank() > 1 ? 'Ton lama finit ' + myRank() + 'e' : 'Remplis plus vite !'], 'Touche pour réessayer');
  else if (state === 'end') { overlayWin('Bravo champion !', ['Les ' + MAX_LEVEL + ' courses sont gagnées !', 'Ton lama est une star'], 'Touche pour le menu'); winStars(); }
  drawConfetti();
  ctx.restore();
}


// ---------- menus, pause ----------
let btns = [], pauseAt = 0;
const PAUSE = { x: 496, y: 116, r: 21 };
function loadSaved() { try { return Math.min(MAX_LEVEL, Math.max(1, +localStorage.getItem('lamaCourse40') || 1)); } catch (e) { return 1; } }
function loadStars() { try { return (localStorage.getItem('lamaCourseStars') || '').padEnd(MAX_LEVEL, '0').slice(0, MAX_LEVEL).split('').map(Number); } catch (e) { return Array(MAX_LEVEL).fill(0); } }
function saveStars(st) { try { localStorage.setItem('lamaCourseStars', st.join('')); } catch (e) { } }
function goMenu() { level = loadSaved(); spraying = false; drops = []; parts = []; pops = []; ripples = []; confetti = []; dust = []; resetRace(); state = 'menu'; lock = time + .3; }
function newGame() { level = 1; try { localStorage.setItem('lamaCourse40', 1); } catch (e) { } startLevel(); }
function pauseGame() { if (state !== 'play') return; spraying = false; state = 'paused'; pauseAt = time; lock = time + .25; }
function resumeGame() { const d = time - pauseAt; for (const r of racers) r.next += d; jar.next += d; endT += d; duckFlip += d; for (const k of ducks) { k.t += d; k.hitT += d; } nextThirst += d; for (const p of pots) { p.until += d; p.t += d; } for (const c of candles) { c.at += d; c.smoke += d; } state = 'play'; }
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function button(label, x, y, w, h, fn, col) {
  btns.push({ x, y, w, h, fn });
  softShadow(x + w / 2, y + h + 4, w / 2, 7, .35);
  ctx.fillStyle = vgrad(y, y + h, col || [[0, '#ff6a72'], [1, '#c8202c']]); rr(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = '#fff6e0'; ctx.lineWidth = 3; rr(x, y, w, h, 18); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x + 8, y + 5, w - 16, h * .3, 10); ctx.fill();
  text(label, x + w / 2, y + h / 2 + 1, 24, '#fff', 'center', '#7a1020');
}
const GREEN = [[0, '#6ae6a0'], [1, '#1f9a62']];
function panel(y0, h) {
  ctx.fillStyle = 'rgba(10,4,20,.7)'; ctx.fillRect(0, -EXT, W, H + 2 * EXT);
  softShadow(W / 2, y0 + h + 10, 240, 22, .5);
  ctx.fillStyle = vgrad(y0, y0 + h, [[0, '#fffaf0'], [1, '#f2dfb8']]); rr(50, y0, W - 100, h, 28); ctx.fill();
  ctx.strokeStyle = '#e3222f'; ctx.lineWidth = 6; rr(58, y0 + 8, W - 116, h - 16, 22); ctx.stroke();
}
function menuScreen() {
  panel(236, 492);
  text('LAMA COURSE', W / 2, 294, 42, '#e3222f', 'center', '#fff');
  text('Arrose, fais tomber, éteins, fais tourner :', W / 2, 334, 19, '#5a2a1a', 'center', '#fff6e0');
  text(MODE_ORDER.length + ' mini-jeux pour faire gagner ton lama !', W / 2, 358, 19, '#5a2a1a', 'center', '#fff6e0');
  MODE_ORDER.forEach((m, i) => modeIcon(m, W / 2 + (i - 2) * 52, 396, .9));
  button('Continuer – niveau ' + level, 100, 432, 340, 66, () => startLevel(), GREEN);
  button('Choisir un niveau', 100, 516, 340, 66, () => { state = 'levels'; lock = time + .3; }, [[0, '#ffc860'], [1, '#d88a1a']]);
  button('Recommencer au début', 100, 600, 340, 66, newGame);
  text('Garde le doigt appuyé pour arroser', W / 2, 700, 17, '#5a2a1a', 'center', '#fff6e0');
  text("Jeu de l'imaginaire de Prune", W / 2, 925, 24, '#ffe9b0', 'center', '#3a1030');
}
function levelsScreen() {   // grille des 60 niveaux : mini-jeu, étoiles, cadenas
  panel(126, 772);
  text('CHOISIS UN NIVEAU', W / 2, 176, 30, '#e3222f', 'center', '#fff');
  const st = loadStars(), un = loadSaved();
  for (let i = 0; i < MAX_LEVEL; i++) {
    const c = i % 6, r = Math.floor(i / 6), x = 76 + c * 66, y = 204 + r * 59, w = 60, h = 53, n = i + 1, open = n <= un;
    if (open) btns.push({ x, y, w, h, fn: () => { level = n; startLevel(); } });
    ctx.fillStyle = open ? vgrad(y, y + h, n === un ? [[0, '#8af0b4'], [1, '#2fa86a']] : [[0, '#ffe0a0'], [1, '#e8a848']]) : 'rgba(110,80,50,.22)'; rr(x, y, w, h, 10); ctx.fill();
    if (!open) { ctx.fillStyle = 'rgba(110,80,50,.5)'; rr(x + 22, y + 22, 16, 13, 3); ctx.fill(); ctx.strokeStyle = 'rgba(110,80,50,.5)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x + 30, y + 22, 5.5, Math.PI, 0); ctx.stroke(); continue; }
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; rr(x + 1, y + 1, w - 2, h - 2, 9); ctx.stroke();
    modeIcon(modeFor(n), x + 16, y + 20, .62);
    text(String(n), x + 42, y + 19, 18, '#fff', 'center', '#7a3a10');
    for (let k = 0; k < 3; k++) star(x + 16 + k * 14, y + 42, 5.5, k < st[i]);
  }
  button('Retour', 150, 814, 240, 58, goMenu);
}
function winStars() {   // étoiles gagnées, posées sur le haut du panneau de victoire
  const y = (level % 5 === 0 ? 230 : 300) - 4;
  for (let k = 0; k < 3; k++) {
    const t = Math.min(1, Math.max(0, (time - winT - .25 - k * .25) / .3)), e = t >= 1 ? 1 : t * (2.2 - 1.2 * t);
    if (k < lastStars && t > 0 && starSnd <= k) { starSnd = k + 1; tone(880 + k * 220, 1320 + k * 220, .12, 'triangle', .12); }
    ctx.save(); ctx.translate(W / 2 + (k - 1) * 64, y - (k === 1 ? 10 : 0)); ctx.scale(k < lastStars ? Math.max(.01, e) : 1, k < lastStars ? Math.max(.01, e) : 1); star(0, 0, k === 1 ? 30 : 25, k < lastStars); ctx.restore();
  }
}
function pauseScreen() {
  panel(300, 330);
  text('PAUSE', W / 2, 365, 42, '#e3222f', 'center', '#fff');
  button('Reprendre', 100, 415, 340, 70, resumeGame, GREEN);
  button('Menu principal', 100, 515, 340, 70, goMenu);
}
function drawPauseBtn() {
  const { x, y, r } = PAUSE;
  softShadow(x, y + r + 2, r, 5, .35);
  ctx.fillStyle = vgrad(y - r, y + r, [[0, 'rgba(90,40,18,.95)'], [1, 'rgba(46,18,8,.95)']]); circ(x, y, r);
  ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke();
  ctx.fillStyle = '#fff6e0'; rr(x - 8, y - 8, 5.5, 16, 2); ctx.fill(); rr(x + 2.5, y - 8, 5.5, 16, 2); ctx.fill();
}

// ---------- audio ----------
let ac;
function audioInit() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { } }
function tone(f0, f1, d, type = 'sine', v = .15) {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}

// ---------- boucle ----------
resetRace();
Q = Math.min(3, Math.max(2, scale));
buildGirl(); buildScreens(); buildRacers();
backL = layer(drawBack); frontL = layer(drawFront); vigL = layer(drawVignette, W, H + 2 * EXT, 1); topL = layer(drawTopExt, W, EXT); botL = layer(drawBotExt, W, EXT);
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
